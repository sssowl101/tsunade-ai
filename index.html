<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsunade AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #170b25, #35104d, #0d1025);
  color: white;
}

.chat {
  max-width: 900px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 18px;
  background: #ffffff12;
  border-bottom: 1px solid #ffffff20;
  font-size: 22px;
  font-weight: bold;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  width: fit-content;
  max-width: 80%;
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: 18px;
  line-height: 1.4;
}

.tsunade {
  background: #ffffff15;
}

.user {
  margin-left: auto;
  background: #7957ff;
}

.input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  background: #00000030;
}

input {
  flex: 1;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 14px;
  background: #ffffff15;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 0 20px;
  background: #ff5b9d;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">
    🍃 Tsunade AI
  </div>

  <div class="messages" id="messages">

    <div class="message tsunade">
      Selam! Ben Tsunade. 😏
    </div>

    <div class="message tsunade">
      Benimle sohbet etmek ister misin?
    </div>

  </div>

  <div class="input-area">
    <input id="input" placeholder="Mesajını yaz...">
    <button onclick="sendMessage()">Gönder</button>
  </div>

</div>

<script>

function sendMessage() {

  let input = document.getElementById("input");
  let messages = document.getElementById("messages");

  let text = input.value.trim();

  if (text === "") return;

  messages.innerHTML += `
    <div class="message user">
      ${text}
    </div>
  `;

  input.value = "";

  setTimeout(function() {

    let replies = [
      "Hımm... İlginç. 😏",
      "Bunu biraz daha anlat.",
      "Haha, gerçekten mi?",
      "Seni dinliyorum.",
      "Pekâlâ... devam et.",
      "Bu konu ilgimi çekti."
    ];

    let reply =
      replies[Math.floor(Math.random() * replies.length)];

    messages.innerHTML += `
      <div class="message tsunade">
        ${reply}
      </div>
    `;

    messages.scrollTop = messages.scrollHeight;

  }, 700);
}

</script>

</body>
</html>
